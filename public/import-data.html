<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Foxford — Import dát</title>
  <style>
    body { font-family: sans-serif; padding: 16px; background: #f5f5f5; }
    h2 { color: #333; }
    textarea { width: 100%; height: 200px; font-size: 11px; border: 1px solid #ddd; border-radius: 6px; padding: 8px; box-sizing: border-box; }
    button { margin-top: 10px; padding: 12px 20px; background: #16a34a; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; width: 100%; }
    #msg { margin-top: 12px; padding: 10px; border-radius: 6px; display: none; }
    .ok { background: #dcfce7; color: #166534; }
    .err { background: #fee2e2; color: #991b1b; }
  </style>
</head>
<body>
  <h2>Foxford — Import dát</h2>
  <p>Vložte skopírované dáta a stlačte Importovať:</p>
  <textarea id="json" placeholder='{"foxford-tasks": "...", ...}'></textarea>
  <button onclick="importData()">Importovať dáta</button>
  <div id="msg"></div>
  <script>
    function importData() {
      const msg = document.getElementById('msg');
      try {
        const data = JSON.parse(document.getElementById('json').value);
        let count = 0;
        for (const [k, v] of Object.entries(data)) {
          if (v !== null && v !== undefined && v !== 'null') {
            localStorage.setItem(k, v);
            count++;
          }
        }
        msg.className = 'ok';
        msg.textContent = 'Importovaných ' + count + ' kľúčov. Presmerovávam na appku...';
        msg.style.display = 'block';
        setTimeout(() => { window.location.href = '/Foxford-app/'; }, 1500);
      } catch (e) {
        msg.className = 'err';
        msg.textContent = 'Chyba: ' + e.message;
        msg.style.display = 'block';
      }
    }
  </script>
</body>
</html>
