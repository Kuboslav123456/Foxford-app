<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Foxford — Obnova</title>
  <style>
    body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: #f5f5f5; }
    p { font-size: 1.2rem; color: #333; }
  </style>
</head>
<body>
  <p id="msg">Čistím cache a service worker...</p>
  <script>
    async function clearAndReload() {
      try {
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          for (const reg of regs) await reg.unregister();
        }
        if ('caches' in window) {
          const keys = await caches.keys();
          for (const key of keys) await caches.delete(key);
        }
        document.getElementById('msg').textContent = 'Hotovo! Presmerovávam...';
        setTimeout(() => { window.location.href = '/Foxford-app/'; }, 1000);
      } catch (e) {
        document.getElementById('msg').textContent = 'Chyba: ' + e.message;
      }
    }
    clearAndReload();
  </script>
</body>
</html>
