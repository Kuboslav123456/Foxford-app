<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Foxford — Export dát</title>
  <style>
    body { font-family: sans-serif; padding: 16px; background: #f5f5f5; }
    h2 { color: #333; }
    .key { font-weight: bold; color: #c00; margin-top: 16px; }
    pre { background: #fff; border: 1px solid #ddd; padding: 10px; border-radius: 6px; white-space: pre-wrap; word-break: break-all; font-size: 11px; max-height: 200px; overflow-y: auto; }
    .empty { color: #999; font-style: italic; }
    button { margin: 4px 0; padding: 8px 14px; background: #2563eb; color: white; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; }
    #all { margin-top: 20px; background: #fff; border: 1px solid #ddd; padding: 10px; border-radius: 6px; font-size: 10px; white-space: pre-wrap; word-break: break-all; }
  </style>
</head>
<body>
  <h2>Foxford — Export dát</h2>
  <p>Vaše dáta z localStorage (screenshotujte alebo skopírujte):</p>
  <button onclick="copyAll()">Kopírovať všetko</button>
  <div id="out"></div>
  <div id="all"></div>
  <script>
    const KEYS = [
      'foxford-tasks','foxford-last-reset-date','foxford-batch',
      'foxford-inspectors','foxford-temp-fields','foxford-inventory-data',
      'foxford-inventory','foxford-inventory-notes','foxford-notes',
      'foxford-haccp-date','foxford-branch',
      'foxford-tasks-version','foxford-ranné-autosent','foxford-večerné-autosent'
    ];
    const out = document.getElementById('out');
    const allData = {};
    KEYS.forEach(k => {
      const v = localStorage.getItem(k);
      allData[k] = v;
      const div = document.createElement('div');
      div.innerHTML = '<div class="key">' + k + '</div>' +
        (v ? '<pre>' + v + '</pre>' : '<div class="empty">(prázdne)</div>');
      out.appendChild(div);
    });
    document.getElementById('all').textContent = JSON.stringify(allData, null, 2);
    function copyAll() {
      navigator.clipboard.writeText(JSON.stringify(allData, null, 2))
        .then(() => alert('Skopírované!'))
        .catch(() => alert('Kopírovanie zlyhalo — screenshotujte stránku.'));
    }
  </script>
</body>
</html>
